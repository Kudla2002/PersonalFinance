<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budgetovka</title>
<meta name="description" content="Osobní rozpočet: příjmy, výdaje a spoření po měsících, kategorie, obchodníci, pravidelné platby a import výpisu. Data zůstávají ve tvém prohlížeči, volitelně i na tvém Google Disku.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budgetovka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="26" height="26"><span>Budgetovka</span></div>
    <nav class="seg" id="segTop" role="tablist" aria-label="Sekce"></nav>
    <span class="spacer"></span>
    <label class="search" id="searchBox" hidden>
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Hledat" autocomplete="off" aria-label="Hledat v pohybech">
    </label>
    <button type="button" class="syncpill" id="syncBtn" data-s="out" hidden><i></i><span id="syncTxt">Přihlásit</span></button>
    <button type="button" class="iconbtn" id="dataBtn" aria-label="Data, import a zálohy" title="Data, import a zálohy">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
    </button>
    <button type="button" class="plus" id="addBtn" aria-label="Přidat pohyb" title="Přidat pohyb (N)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabbar" id="tabBottom" aria-label="Sekce"><div class="tabbar-in" role="tablist"></div></nav>

<dialog id="entryDlg" aria-label="Pohyb"></dialog>
<dialog id="dataDlg" aria-label="Data"></dialog>
<dialog id="importDlg" aria-label="Import výpisu"></dialog>
<dialog id="merchDlg" aria-label="Obchodník"></dialog>
<dialog id="triageDlg" aria-label="Nezařazené pohyby"></dialog>
<dialog id="rulesDlg" aria-label="Pravidla zařazení"></dialog>
<dialog id="limitDlg" aria-label="Limit"></dialog>

<input type="file" id="fileCsv" class="kfile" accept=".csv,.tsv,.txt,text/csv,text/plain" tabindex="-1" aria-hidden="true">
<input type="file" id="fileJson" class="kfile" accept=".json,application/json" tabindex="-1" aria-hidden="true">

<div id="toast" role="status" hidden></div>
<div id="tip" role="tooltip" hidden></div>

<noscript><p style="padding:24px;font-family:sans-serif">Budgetovka potřebuje zapnutý JavaScript.</p></noscript>

<script src="rules.js"></script>
<script src="cats.js"></script>
<script src="analytics.js"></script>
<script src="importer.js"></script>
<script src="app.js"></script>
<script src="kit.js"></script>
<script src="views.js"></script>
<script src="dialogs.js"></script>
</body>
</html>
